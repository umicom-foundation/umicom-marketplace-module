schema: umicom.application.v1

application:
  id: org.umicom.marketplace
  name: Umicom Marketplace
  short_name: Marketplace
  version: 0.1.0
  executable: umicom-marketplace-console
  aliases: [marketplace]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console

entry:
  kind: workbench
  taskbar_group: system
  pinned_by_default: false
  default_layout: marketplace

capabilities:
  - umicom.product
  - umicom.delivery
  - umicom.security
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true
